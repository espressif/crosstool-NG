include:
  - template: 'Workflows/Branch-Pipelines.gitlab-ci.yml'

stages:
  - macos_codesign

image: ${CI_DOCKER_REGISTRY}/esp32-ci-env

macos_codesign:
  stage: macos_codesign
  resource_group: macos_codesign
  tags: [ "darwin", "codesign" ]
  # list all jobs that produces macos distros
  variables:
    # don't need to have repo
    GIT_STRATEGY: none
    # URL to macos codesign repo
    NOTARIZATION_SCRIPTS_GIT: ${GITLAB_HTTPS_SERVER}/espressif/macos_codesign_notarization.git
  script:
    - NOTARIZATION_SCRIPTS_GIT=$(echo $NOTARIZATION_SCRIPTS_GIT | sed 's|https://|https://gitlab-ci-token:'${CI_JOB_TOKEN}'@|'}
    - echo $NOTARIZATION_SCRIPTS_GIT
    - ./macos_codesign_notarization/run.sh

