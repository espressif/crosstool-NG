include:
  - template: 'Workflows/Branch-Pipelines.gitlab-ci.yml'

stages:
  - invalidate_aws3

image: $CI_REGISTRY_IMAGE/default:latest

variables:
  # GIT_STRATEGY - use option from "CI / CD Settings" - "General pipelines"
  GIT_SUBMODULE_STRATEGY: normal

  # show artifact downloading progress
  TRANSFER_METER_FREQUENCY: 5s

  ARCHIVE_TOOL: "tar -cJvf" # 'v' we need to check the contents of the archive by log
  UNARCHIVE_TOOL: "tar -xf"
  ARCHIVE_EXT: "tar.xz"

  GIT_SERVER: "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}"

.use_ci_tools: &use_ci_tools |
  curl -sSL ${CIT_LOADER_URL} -o cit_loader.sh && sh cit_loader.sh
  source citools/import_functions

# ESPCI_HOMEBREW_PREFIX is set up in runner's config.toml
.check_and_setup_homebrew: &check_and_setup_homebrew |
  if [[ "$OSTYPE" == "darwin"* ]]; then
    eval "$(${ESPCI_HOMEBREW_PREFIX}/bin/brew shellenv)"
  fi

invalidate_aws3:
  stage: invalidate_aws3
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  tags: [ "deploy", "internet" ]
  variables:
    GIT_SUBMODULE_STRATEGY: none
    UPLOAD_PATH: "toolchains/preview/baremetal/crosstool-ng-1.28.0.41-7d1fa3c"
    S3_PUBLIC_DIR: "${STORAGE_BASE_URL}/${UPLOAD_PATH}"
    FILES_LIST: "riscv32-esp-elf-crosstool-ng-1.28.0.41-7d1fa3c-x86_64-linux-gnu.tar.xz crosstool-NG-crosstool-ng-1.28.0.41-7d1fa3c-checksum.sha256"
  script:
    # Invalidate S3-backed CloudFront cache.
    - |
      echo ""
      echo "Invalidate s3 cache"
      for f in ${FILES_LIST}; do
        aws cloudfront create-invalidation \
            --distribution-id ${DL_DISTRIBUTION_ID} \
            --paths "/${S3_PUBLIC_DIR#*//*/}/${f}"
        echo "Submitted invalidation for file ${f}"
      done
      echo ""
      echo "All invalidation requests submitted"
      echo ""