# Pipeline control rules
# Only use branch and tag pipelines for simplicity, not merge_request_event
workflow:
  rules:
    # Tag: rebuild docker as a tagged
    - if: $CI_COMMIT_TAG
      variables:
        IMAGE_TAG: "$CI_COMMIT_TAG"
        BUILD_IMAGE: 1
    # Target branch: rebuild docker as a 'latest'
    # (can't use a variable inside 'if' for the branch name)
    - if: '$CI_COMMIT_BRANCH == "esp-linux-1.28.x-dev"'
      variables:
        BUILD_IMAGE: 1
    # Feature branch, docker image has changed: an SHA-tagged image
    # (can't use a variable inside 'compare_to' for the branch name)
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: 'refs/heads/esp-linux-1.28.x-dev'
        paths:
          - .gitlab/docker/ci/**/*
      variables:
        IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
        BUILD_IMAGE: 1
    # Feature branch, docker image has not changed: don't rebuild docker, use 'latest'
    - if: $CI_COMMIT_BRANCH

stages:
  - images
  - generate_version
  - build
  - sources
  - test
  - deploy
  - release
  - docker

include:
  - { file: /include/build_image.yml, project: ci/gitlab-templates, ref: v1 }

variables:
  # Target branch for changes when preparing release
  RELEASE_BRANCH: "esp-linux-1.28.x-dev"

  BUILD_IMAGE: 0
  PRIMARY_HOSTS_RE: '/^(x86_64-linux-gnu|aarch64-linux-gnu)$/'
  PRIMARY_TARGETS_RE: '/^(riscv64-esp-linux-musl)$/'
  IMAGE_TAG: "latest"
  IMAGE_REGISTRY: "${CI_REGISTRY_IMAGE}/${RELEASE_BRANCH}"

  # GIT_STRATEGY - use option from "CI / CD Settings" - "General pipelines"
  GIT_SUBMODULE_STRATEGY: normal

  # show artifact downloading progress
  TRANSFER_METER_FREQUENCY: 5s

  ARCHIVE_TOOL: "tar -cJvf"  # 'v' we need to check the contents of the archive by log
  UNARCHIVE_TOOL: "tar -xf"
  ARCHIVE_EXT: "tar.xz"

  GIT_SERVER: "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}"
  STORAGE_URL: "${STORAGE_BASE_URL}/toolchains/preview/riscv64"

# ESPCI_HOMEBREW_PREFIX is set up in runner's config.toml
.check_and_setup_homebrew: &check_and_setup_homebrew |
  if [[ "$OSTYPE" == "darwin"* ]]; then
    eval "$(${ESPCI_HOMEBREW_PREFIX}/bin/brew shellenv)"
  fi

default:
  tags: [ "build", "amd64" ]
  image: ${IMAGE_REGISTRY}-default:${IMAGE_TAG}
  before_script:
    - *check_and_setup_homebrew

.rules_primary_builds: &rules_primary_builds
  - if: '$CONF_HOST =~ $PRIMARY_HOSTS_RE && $CONF_TARGET =~ $PRIMARY_TARGETS_RE'
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_COMMIT_BRANCH == $RELEASE_BRANCH'

# Configure crosstool-NG
.build_ctng: &build_ctng |
  ./bootstrap
  ./configure --enable-local
  make
  ./ct-ng ${CONF_TARGET}

# ct-ng options common for all platforms
.configure_common: &configure_common |
  echo "# CT_SHOW_CT_VERSION is not set" >> .config
  echo "CT_TOOLCHAIN_PKGVERSION=\"${DIST_VERSION_FULL}\"" >> .config
  echo "# CT_LOG_PROGRESS_BAR is not set" >> .config
  echo "# CT_PREFIX_DIR_RO is not set" >> .config
  echo "CT_LOG_EXTRA=y" >> .config
  echo "CT_LOG_LEVEL_MAX=\"EXTRA\"" >> .config
  echo "CT_LOG_TO_FILE=y" >> .config
  echo "# CT_LOG_FILE_COMPRESS is not set" >> .config
  echo "CT_KERNEL_LINUX_INSTALL_CHECK=y" >> .config
  echo "CT_USE_MIRROR=y" >> .config
  echo "CT_FORCE_MIRROR=y" >> .config
  echo "CT_MIRROR_BASE_URL=\"${MIRROR_BASE}\"" >> .config
  echo "CT_GCC_DEVEL_URL=\"${GIT_SERVER}/idf/gcc.git\"" >> .config
  echo "CT_GLIBC_DEVEL_URL=\"${GIT_SERVER}/idf/glibc.git\"" >> .config
  echo "CT_MUSL_DEVEL_URL=\"${GIT_SERVER}/idf/musl.git\"" >> .config
  echo "CT_NEWLIB_DEVEL_URL=\"${GIT_SERVER}/idf/newlib-cygwin.git\"" >> .config
  echo "CT_BINUTILS_DEVEL_URL=\"${GIT_SERVER}/idf/binutils-gdb.git\"" >> .config
  echo "CT_GDB_DEVEL_URL=\"${GIT_SERVER}/idf/binutils-gdb.git\"" >> .config

# Configuration specific to Docker
.configure_docker: &configure_docker |
  echo "CT_ALLOW_BUILD_AS_ROOT=y" >> .config
  echo "CT_ALLOW_BUILD_AS_ROOT_SURE=y" >> .config
  echo "CT_CONNECT_TIMEOUT=30" >> .config

# If PIE is enabled by default in build GCC, add a flag to disable it
# For example, it appears on Ubuntu 17.04 or Debian 9
.configure_linux_no_pie: &configure_linux_no_pie |
  gcc -v |& grep -- --enable-default-pie > /dev/null && echo "CT_EXTRA_LDFLAGS_FOR_HOST=\"-no-pie\"" >> .config

# Configuration specific to crossbuilds
.configure_crossbuild: &configure_crossbuild |
  echo "CT_CANADIAN=y" >> .config
  echo "CT_BUILD=\"${CONF_BUILD}\"" >> .config
  echo "CT_BUILD_PREFIX=\"${CONF_BUILD}-\"" >> .config
  echo "CT_BUILD_SUFFIX=\"\"" >> .config
  echo "CT_HOST=\"${CONF_HOST}\"" >> .config
  echo "CT_HOST_PREFIX=\"${CONF_HOST}-\"" >> .config
  echo "CT_HOST_SUFFIX=\"\"" >> .config

.configure_win_crossbuild: &configure_win_crossbuild |
  # Append option
  ( \
    KV=$(grep "CT_CC_GCC_EXTRA_CONFIG_ARRAY" .config) \
    && echo "${KV%\"} --with-gnu-ld\"" >> .config; \
  )

# Actual build
.build_toolchain: &build_toolchain |
  ./ct-ng oldconfig
  apt-get remove --autoremove libncurses-dev || true
  ./ct-ng build.${MAKE_PARALLEL_JOBS:-2}

.add_extra_files: &add_extra_files |
  if [ "${EXTRA_BINS:-}" ]; then
    cp -v ${EXTRA_BINS} builds/${CONF_TARGET}/bin/
  fi

# Package the toolchain
.package_toolchain: &package_toolchain |
  mkdir -p dist
  cd builds
  ls -l
  rm -fv ${CONF_TARGET}/build.log*
  ${ARCHIVE_TOOL} ${ARCHIVE_NAME} ${CONF_TARGET}/ > tar-list.txt 2>&1
  ls -l
  mv -v tar-list.txt ${CI_PROJECT_DIR}/
  mv -v ${ARCHIVE_NAME} ${CI_PROJECT_DIR}/dist/
  echo "${ARCHIVE_NAME}" > ${CI_PROJECT_DIR}/dist/dist_name_${CONF_HOST}_${CONF_TARGET}
  ls -l ${CI_PROJECT_DIR}/dist/
  cd -
  echo "Job disk usage $(du -hs ${CI_PROJECT_DIR})"

default_image:
  extends: .build_image_template
  stage: images
  variables:
    BUILD_IMAGE_URI: ${IMAGE_REGISTRY}-default:${IMAGE_TAG}
    BUILD_IMAGE_DOCKERFILE: ".gitlab/docker/ci/Dockerfile.default"
  before_script: []

build-linux-x86_64_image:
  extends: .build_image_template
  stage: images
  variables:
    BUILD_IMAGE_URI: ${IMAGE_REGISTRY}-build-linux-x86_64:${IMAGE_TAG}
    BUILD_IMAGE_DOCKERFILE: ".gitlab/docker/ci/Dockerfile.linux-x86_64"
  before_script: []

build-linux-i586_image:
  extends: .build_image_template
  stage: images
  variables:
    BUILD_IMAGE_URI: ${IMAGE_REGISTRY}-build-linux-i586:${IMAGE_TAG}
    BUILD_IMAGE_DOCKERFILE: ".gitlab/docker/ci/Dockerfile.linux-i586"
  before_script: []

build-linux-arm-cross_image:
  extends: .build_image_template
  stage: images
  variables:
    BUILD_IMAGE_URI: ${IMAGE_REGISTRY}-build-linux-arm-cross:${IMAGE_TAG}
    BUILD_IMAGE_DOCKERFILE: ".gitlab/docker/ci/Dockerfile.linux-arm-cross"
  before_script: []

generate_version:
  stage: generate_version
  needs:
    - job: default_image
      optional: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
  artifacts:
    reports:
      dotenv: version.env
  script:
    - PREFIX="esp-linux-"
    - DIST_VERSION_SHORT=$(${CI_PROJECT_DIR}/maintainer/git-version-gen --prefix "${PREFIX}" .)
    - DIST_VERSION_FULL="${PREFIX}${DIST_VERSION_SHORT}"
    - true > version.env
    - echo "DIST_VERSION_FULL=$DIST_VERSION_FULL" >> version.env
    - echo "DIST_VERSION_SHORT=$DIST_VERSION_SHORT" >> version.env
    - cat version.env

# Common template for all builds
.build_template:
  rules: *rules_primary_builds
  tags: [ "build", "amd64", "nocaps" ]
  stage: build
  allow_failure: true
  variables:
    # Do not compress artifacts because we already use compressed archives
    ARTIFACT_COMPRESSION_LEVEL: "fastest"
    ARCHIVE_NAME: ${CONF_TARGET}-${DIST_VERSION_SHORT}-${CONF_HOST}.${ARCHIVE_EXT}
    CONF_BUILD: "x86_64-linux-gnu"
  artifacts:
    paths:
      - .config
      - build.log.bz2
      - tar-list.txt
      - dist
    when: always
  after_script:
    # Use Git index to clean all except only needed files (to become artifacts)
    # Works on both failure and success
    - test -f .config && git add -f .config
    - test -f build.log && bzip2 build.log
    - test -f build.log.bz2 && git add -f build.log.bz2 && echo "You can view compressed build log with 'bzless'"
    - test -f tar-list.txt && git add -f tar-list.txt
    - test -d dist && git add -f dist
    - git clean -dxff >/dev/null
    - echo "Job disk usage $(du -hs ${CI_PROJECT_DIR})"

.build_template_linux:
  extends: .build_template
  script:
    - *build_ctng
    - *configure_common
    - *configure_docker
    - *configure_linux_no_pie
    - *build_toolchain
    - *package_toolchain

musl_x86_64_build:
  extends: .build_template_linux
  rules: *rules_primary_builds
  image: ${IMAGE_REGISTRY}-build-linux-x86_64:${IMAGE_TAG}
  needs:
    - job: build-linux-x86_64_image
      optional: true
    - generate_version
  variables:
    CONF_HOST: "x86_64-linux-gnu"
    CONF_TARGET: "riscv64-esp-linux-musl"

musl_i586_build:
  extends: .build_template_linux
  image: ${IMAGE_REGISTRY}-build-linux-i586:${IMAGE_TAG}
  needs:
    - job: build-linux-i586_image
      optional: true
    - generate_version
  variables:
    CONF_HOST: "i586-linux-gnu"
    CONF_TARGET: "riscv64-esp-linux-musl"

.template_lin_arm_cross:
  extends: .build_template
  image: ${IMAGE_REGISTRY}-build-linux-arm-cross:${IMAGE_TAG}
  needs:
    - job: build-linux-arm-cross_image
      optional: true
    - generate_version
  script:
    - *build_ctng
    - *configure_common
    - *configure_docker
    - *configure_linux_no_pie
    - *configure_crossbuild
    - *build_toolchain
    - *package_toolchain

musl_aarch64_build:
  extends: .template_lin_arm_cross
  rules: *rules_primary_builds
  variables:
    CONF_HOST: "aarch64-linux-gnu"
    CONF_TARGET: "riscv64-esp-linux-musl"

musl_armhf_build:
  extends: .template_lin_arm_cross
  variables:
    CONF_HOST: "arm-linux-gnueabihf"
    CONF_TARGET: "riscv64-esp-linux-musl"

musl_armel_build:
  extends: .template_lin_arm_cross
  variables:
    CONF_HOST: "arm-linux-gnueabi"
    CONF_TARGET: "riscv64-esp-linux-musl"

.gen_sha256_file: &gen_sha256_file |
  FILES_LIST=$(find . -name dist_name_\* -exec cat {} \+)
  SHA256_FILE="${CI_PROJECT_NAME}-${DIST_VERSION_FULL}-checksum.sha256"
  for n in $FILES_LIST; do
    sz=$(stat -c%s "${n}")
    printf "# %s: %s bytes\n" "${n}" "${sz}" >> ${SHA256_FILE};
    sha256sum -b "${n}" >> ${SHA256_FILE};
  done
  FILES_LIST="${SHA256_FILE} ${FILES_LIST}"

.upload_to_dl_s3_template:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  when: manual
  allow_failure: true
  tags: [ "deploy", "internet" ]
  variables:
    # don't use "GIT_STRATEGY: none", because we need cleaning old artifacts in 'dist/' that came from previous pipelines
    GIT_SUBMODULE_STRATEGY: none
    S3_UPLOAD_DIR: "s3://${DL_BUCKET}/dl/toolchains/preview/riscv64/${DIST_VERSION_SHORT}"
    S3_PUBLIC_DIR: "${STORAGE_URL}/${DIST_VERSION_SHORT}"
  before_script: []
  script:
    - cd dist
    # Create a checksum file
    - *gen_sha256_file

    # Upload all needed files
    - |
      for f in ${FILES_LIST}; do
        echo aws s3 cp --acl=public-read --no-progress "$f" "${S3_UPLOAD_DIR}/"
        aws s3 cp --acl=public-read --no-progress "$f" "${S3_UPLOAD_DIR}/"
      done

    # Show download links
    - |
      echo ""
      echo "Archives were published there:"
      for f in ${FILES_LIST}; do
        echo "${S3_PUBLIC_DIR}/${f}"
      done
      echo ""
    - echo "${SHA256_FILE}:"
    - cat ${SHA256_FILE}

upload_to_dl_s3:
  extends: .upload_to_dl_s3_template
  needs:
    - generate_version
    - job: musl_x86_64_build
      optional: true
    - job: musl_i586_build
      optional: true
    - job: musl_aarch64_build
      optional: true
    - job: musl_armhf_build
      optional: true
    - job: musl_armel_build
      optional: true

# Getting sources and tests

.prepare_sources_template:
  needs:
    - job: default_image
      optional: true
  stage: sources
  artifacts:
    paths:
      - sources/${SOURCE_NAME}*.tar.xz
    reports:
      dotenv: sources.env
  script:
    - mkdir -p sources/ && cd sources/
    - rm -rf ${SOURCE_NAME}*
    - |
      # Try to checkout the same branch with the same branch/tag name. Otherwise checkout the specified branch
      if git clone -q --depth=1 "${SOURCE_REPO_URL}" -b "${CI_COMMIT_REF_NAME}"; then
          echo "Cloned branch: ${CI_COMMIT_REF_NAME}"
      else
          if [ -z "${SOURCE_REPO_BRANCH:-}" ] ; then
            echo "Error: SOURCE_REPO_BRANCH is not set" >&2
            exit 1
          fi
          git clone -q --depth=1 "${SOURCE_REPO_URL}" -b "${SOURCE_REPO_BRANCH}"
          echo "Cloned branch: ${SOURCE_REPO_BRANCH}"
      fi
    - GITDIR=${SOURCE_REPO_URL##*/}
    - GITDIR=${GITDIR%.git}
    - cd ${GITDIR}
    - echo "The last log:"
    - git log --oneline
    - SHA=$(git rev-parse --short HEAD)
    - rm -rf .git
    - cd ..
    - TARBALL="${SOURCE_NAME}-git-${SHA}.tar.xz"
    - time tar -c -I 'xz -T0' -f ${TARBALL} ${GITDIR}
    - ls -l ${CI_PROJECT_DIR}/sources/

    - |
      if [ -z "${SOURCE_NAME_SLUG:-}" ] ; then
        SOURCE_NAME_SLUG=${SOURCE_NAME^^}; SOURCE_NAME_SLUG=${SOURCE_NAME_SLUG//[^A-Z0-9_]/_}
      fi
    - ENV_VAR="SOURCE_${SOURCE_NAME_SLUG}_TARBALL=sources/${TARBALL}"
    - echo $ENV_VAR >> ${CI_PROJECT_DIR}/sources.env
    - cat ${CI_PROJECT_DIR}/sources.env

esp_compiler_tests_sources:
  extends: .prepare_sources_template
  variables:
    SOURCE_NAME: "esp-compiler-tests"
    SOURCE_REPO_URL: "${GIT_SERVER}/idf/esp-compiler-tests.git"
    SOURCE_REPO_BRANCH: ${RELEASE_BRANCH}
  before_script: []

gcc_sources:
  extends: .prepare_sources_template
  variables:
    SOURCE_NAME: "gcc"
    SOURCE_REPO_URL: "${GIT_SERVER}/idf/gcc.git"
    BRANCH_VAR: "CT_GCC_DEVEL_BRANCH"
    CONF_TARGET: "riscv64-esp-linux-gnu"
  before_script:
    - set +u
    - . "${CI_PROJECT_DIR}/samples/${CONF_TARGET}/crosstool.config"
    - set -u
    - SOURCE_REPO_BRANCH=${!BRANCH_VAR}

binutils_sources:
  extends: .prepare_sources_template
  variables:
    SOURCE_NAME: "binutils"
    SOURCE_REPO_URL: "${GIT_SERVER}/idf/binutils-gdb.git"
    BRANCH_VAR: "CT_BINUTILS_DEVEL_BRANCH"
    CONF_TARGET: "riscv64-esp-linux-gnu"
  before_script:
    - set +u
    - . "${CI_PROJECT_DIR}/samples/${CONF_TARGET}/crosstool.config"
    - set -u
    - SOURCE_REPO_BRANCH=${!BRANCH_VAR}

gdb_sources:
  extends: .prepare_sources_template
  variables:
    SOURCE_NAME: "gdb"
    SOURCE_REPO_URL: "${GIT_SERVER}/idf/binutils-gdb.git"
    BRANCH_VAR: "CT_GDB_DEVEL_BRANCH"
    CONF_TARGET: "riscv64-esp-linux-gnu"
  before_script:
    - set +u
    - . "${CI_PROJECT_DIR}/samples/${CONF_TARGET}/crosstool.config"
    - set -u
    - SOURCE_REPO_BRANCH=${!BRANCH_VAR}

#
# Compiler tests: build-only and just-run-tools
#

.template_compiler_tests:
  rules: *rules_primary_builds
  stage: test
  artifacts:
    when: always
    paths:
      - esp-compiler-tests/**/*.log
      - esp-compiler-tests/**/*.elf
  variables:
    GIT_STRATEGY: none
  script:
    # From x_build
    - ARCHIVE_NAME=$(cat dist/dist_name_${CONF_HOST}_${CONF_TARGET})
    - ${UNARCHIVE_TOOL} dist/${ARCHIVE_NAME}
    - export PATH="${CI_PROJECT_DIR}/${CONF_TARGET}/bin:${PATH}"
    - export CONF_TARGET="${CONF_TARGET_WRAPPER:-$CONF_TARGET}"

    # From esp_compiler_tests_sources
    - tar -xf ${SOURCE_ESP_COMPILER_TESTS_TARBALL}

    - echo ""
    - echo "*** Just-run-tools tests ****"
    - echo ""
    - |
      (
        cd esp-compiler-tests/just-run-tools
        ./run.sh
      )
    - echo ""
    - echo "*** Binary analysis ****"
    - echo ""
    - |
      (
        cd esp-compiler-tests/bin-analysis
        ./run.sh
      )
    - echo ""
    - echo "*** Build-only tests ****"
    - echo ""
    - |
      (
        cd esp-compiler-tests/build-only
        source profile-${CONF_TARGET}
        ./run-all.sh
      )

musl_compiler_tests:
  extends: .template_compiler_tests
  needs: [ musl_x86_64_build, esp_compiler_tests_sources ]
  variables:
    CONF_HOST: "x86_64-linux-gnu"
    CONF_TARGET: "riscv64-esp-linux-musl"

.dejagnu_test_template:
  rules: *rules_primary_builds
  stage: test
  tags: [ "build", "amd64", "brew" ]
  variables:
    CONF_HOST: "x86_64-linux-gnu"
    WORKDIR: "workdir"
    TOOL_TRIPLET: ${CONF_TARGET}
    # Empty for all tests
    INCLUDE_TEST: ""
  artifacts:
    paths:
      - ${WORKDIR}/${TOOL_NAME}.log.xz
      - ${WORKDIR}/${TOOL_NAME}.sum.xz
      - ${WORKDIR}/dbg.log.xz
      - report*.xml
    reports:
      junit: report*.xml
    when: always
  script:
    - rm -rf ${WORKDIR} && mkdir -p ${WORKDIR}

    # From X_sources
    - ls -l sources/*

    # From X_build
    - ARCHIVE_NAME=$(cat dist/dist_name_${CONF_HOST}_${CONF_TARGET})
    - export TOOLCHAIN_DIST_TARBALL=dist/${ARCHIVE_NAME}

    # From esp_compiler_tests_sources
    - tar -xf ${SOURCE_ESP_COMPILER_TESTS_TARBALL}
    - ./esp-compiler-tests/dejagnu/riscv64-linux/run.sh ${INCLUDE_TEST}
    - ./esp-compiler-tests/dejagnu/sum2junit.sh "${WORKDIR}/${TOOL_NAME}.sum" "report-${TOOL_TRIPLET}-${TOOL_NAME}.xml"
    - xz ${WORKDIR}/${TOOL_NAME}.log
    - xz ${WORKDIR}/${TOOL_NAME}.sum
    - xz ${WORKDIR}/dbg.log

musl_dejagnu_gcc_test:
  extends: .dejagnu_test_template
  needs: [ musl_x86_64_build, esp_compiler_tests_sources, gcc_sources ]
  variables:
    CONF_TARGET: "riscv64-esp-linux-musl"
    TOOL_NAME: "gcc"
    TOOL_SOURCE_TESTSUITE_DIR: "gcc/gcc/testsuite"
  before_script:
    # From gcc_sources
    - export TOOL_SOURCE_TARBALL=${SOURCE_GCC_TARBALL}

musl_dejagnu_gxx_test:
  extends: .dejagnu_test_template
  needs: [ musl_x86_64_build, esp_compiler_tests_sources, gcc_sources ]
  variables:
    CONF_TARGET: "riscv64-esp-linux-musl"
    TOOL_NAME: "g++"
    TOOL_SOURCE_TESTSUITE_DIR: "gcc/gcc/testsuite"
  before_script:
    # From gcc_sources
    - export TOOL_SOURCE_TARBALL=${SOURCE_GCC_TARBALL}

musl_dejagnu_gas_test:
  extends: .dejagnu_test_template
  needs: [ musl_x86_64_build, esp_compiler_tests_sources, binutils_sources ]
  variables:
    CONF_TARGET: "riscv64-esp-linux-musl"
    TOOL_NAME: "gas"
    TOOL_SOURCE_TESTSUITE_DIR: "binutils-gdb/gas/testsuite"
  before_script:
    # From binutils_sources
    - export TOOL_SOURCE_TARBALL=${SOURCE_BINUTILS_TARBALL}

musl_dejagnu_ld_test:
  extends: .dejagnu_test_template
  needs: [ musl_x86_64_build, esp_compiler_tests_sources, binutils_sources ]
  variables:
    CONF_TARGET: "riscv64-esp-linux-musl"
    TOOL_NAME: "ld"
    TOOL_SOURCE_TESTSUITE_DIR: "binutils-gdb/ld/testsuite"
  before_script:
    # From binutils_sources
    - export TOOL_SOURCE_TARBALL=${SOURCE_BINUTILS_TARBALL}

musl_dejagnu_gdb_test:
  extends: .dejagnu_test_template
  needs: [ musl_x86_64_build, esp_compiler_tests_sources, gdb_sources ]
  variables:
    CONF_TARGET: "riscv64-esp-linux-musl"
    TOOL_NAME: "gdb"
    TOOL_SOURCE_TESTSUITE_DIR: "binutils-gdb/gdb/testsuite"
    INCLUDE_TEST: "gdb.base/break.exp"
  before_script:
    # From gdb_sources
    - export TOOL_SOURCE_TARBALL=${SOURCE_GDB_TARBALL}

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - generate_version
    - job: upload_to_dl_s3
      artifacts: false
    - job: musl_x86_64_build
      artifacts: false
    - job: musl_i586_build
      artifacts: false
    - job: musl_aarch64_build
      artifacts: false
    - job: musl_armhf_build
      artifacts: false
    - job: musl_armel_build
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: true
  variables:
    S3_PUBLIC_DIR: "${STORAGE_URL}/${DIST_VERSION_SHORT}"
    RELEASE_ASSET_MUSL_X86_64: "riscv64-esp-linux-musl-${DIST_VERSION_SHORT}-x86_64-linux-gnu.${ARCHIVE_EXT}"
    RELEASE_ASSET_MUSL_I586: "riscv64-esp-linux-musl-${DIST_VERSION_SHORT}-i586-linux-gnu.${ARCHIVE_EXT}"
    RELEASE_ASSET_MUSL_AARCH64: "riscv64-esp-linux-musl-${DIST_VERSION_SHORT}-aarch64-linux-gnu.${ARCHIVE_EXT}"
    RELEASE_ASSET_MUSL_ARMHF: "riscv64-esp-linux-musl-${DIST_VERSION_SHORT}-arm-linux-gnueabihf.${ARCHIVE_EXT}"
    RELEASE_ASSET_MUSL_ARMEL: "riscv64-esp-linux-musl-${DIST_VERSION_SHORT}-arm-linux-gnueabi.${ARCHIVE_EXT}"
  before_script: []
  script:
    - echo "Creating release ${DIST_VERSION_FULL}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "${DIST_VERSION_FULL}"
    description: "Espressif RISC-V 64-bit Linux GCC toolchain, release ${DIST_VERSION_FULL}"
    assets:
      links:
        - name: "${RELEASE_ASSET_MUSL_X86_64}"
          url: "${S3_PUBLIC_DIR}/${RELEASE_ASSET_MUSL_X86_64}"
          link_type: other
        - name: "${RELEASE_ASSET_MUSL_I586}"
          url: "${S3_PUBLIC_DIR}/${RELEASE_ASSET_MUSL_I586}"
          link_type: other
        - name: "${RELEASE_ASSET_MUSL_AARCH64}"
          url: "${S3_PUBLIC_DIR}/${RELEASE_ASSET_MUSL_AARCH64}"
          link_type: other
        - name: "${RELEASE_ASSET_MUSL_ARMHF}"
          url: "${S3_PUBLIC_DIR}/${RELEASE_ASSET_MUSL_ARMHF}"
          link_type: other
        - name: "${RELEASE_ASSET_MUSL_ARMEL}"
          url: "${S3_PUBLIC_DIR}/${RELEASE_ASSET_MUSL_ARMEL}"
          link_type: other
        - name: "${CI_PROJECT_NAME}-${DIST_VERSION_FULL}-checksum.sha256"
          url: "${S3_PUBLIC_DIR}/${CI_PROJECT_NAME}-${DIST_VERSION_FULL}-checksum.sha256"
          link_type: other

#
# The dist images contain a prebuilt toolchain intended for testing other projects
#

.dist_docker_template:
  extends: .build_image_template
  stage: docker
  rules: *rules_primary_builds
  when: manual
  allow_failure: true
  variables:
    CONF_HOST: "x86_64-linux-gnu"
    BUILD_IMAGE: 1
    BUILD_IMAGE_URI: "${CI_REGISTRY_IMAGE}/dist-${CONF_TARGET}:${DIST_VERSION_SHORT}"
    BUILD_IMAGE_DOCKERFILE: ".gitlab/docker/dist/Dockerfile"
    BUILD_IMAGE_EXTRA_ARGS: "--build-arg TARGET=${CONF_TARGET}"
  before_script:
    - cd .gitlab/docker/dist/
    - tar -xf "${CI_PROJECT_DIR}/dist/$(cat dist/dist_name_${CONF_HOST}_${CONF_TARGET})"
  after_script:
    - rm -rv "${CI_PROJECT_DIR}/.gitlab/docker/dist/${CONF_TARGET}" | tail -2

musl_x86_64_docker:
  extends: .dist_docker_template
  needs: [ generate_version, musl_x86_64_build ]
  variables:
    CONF_TARGET: "riscv64-esp-linux-musl"
