  image: $CI_REGISTRY_IMAGE/build-linux-x86_64:latest
  variables:
    PLATFORM_NAME: "x86_64-linux-gnu"
    CONF_HOST: "x86_64-linux-gnu"
    CONF_TARGET: "riscv32-esp-elf"
    PLATFORMIO_SYSTEM: "\"linux_x86_64\""

xtensa_esp_lin_i586:
  extends: .build_template_linux
  image: $CI_REGISTRY_IMAGE/build-linux-x86:latest
  variables:
