    - riscv32_esp_lin_armhf
    - riscv32_esp_lin_i586
    - xtensa_esp_lin_amd64
    - xtensa_esp_lin_arm64
    - xtensa_esp_lin_armel
    - xtensa_esp_lin_armhf
    - xtensa_esp_lin_i586
    - macos_codesign_riscv32_esp_macos
    - macos_codesign_riscv32_esp_macos_arm64
    - macos_codesign_xtensa_esp_macos
    - macos_codesign_xtensa_esp_macos_arm64
    - win_manifest_riscv32_esp_win
    - win_manifest_riscv32_esp_win64
    - win_manifest_xtensa_esp_win
    - win_manifest_xtensa_esp_win64

